apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-extraction
  namespace: fraud-detection
spec:
  replicas: 3
  selector:
    matchLabels:
      app: transaction-extraction
  template:
    metadata:
      labels:
        app: transaction-extraction
    spec:
      containers:
        - name: transaction-extraction
          image: your-repo/transaction-extraction:latest
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          volumeMounts:
            - mountPath: /app/ml_models
              name: ml-models-volume
      volumes:
        - name: ml-models-volume
          persistentVolumeClaim:
            claimName: ml-models-pvc  # Create a PVC for models
